[package]
name = "seedless"
version = "1.1.0"
edition = "2021"

[dependencies]
frost-secp256k1-tr = "2"
bitcoin = { version = "0.32", features = ["serde"] }
secp256k1 = { version = "0.29", features = ["rand"] }
bip32 = "0.5"
hmac = "0.12"
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
secrecy = { version = "0.8", features = ["serde", "alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
rand = "0.8"
anyhow = "1"
thiserror = "1"
rpassword = "7"
dirs = "5"
chacha20poly1305 = "0.10.1"
pbkdf2 = "0.12.2"
libc = "0.2"
bip39 = "2.2"

[features]
default = []
hsm-yubikey = []
hsm-nitrokey = []
hsm-all = ["hsm-yubikey", "hsm-nitrokey"]

[dev-dependencies]
tempfile = "3"
